name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      # Catches syntax errors in the modules the test suite does not import,
      # which is everything that pulls in torch or streamlit.
      - name: Byte-compile every module
        run: python -m compileall -q PDFread.py inference.py retrieval.py pdf_extract.py benchmarks tests

  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # requirements.txt was committed as UTF-16LE once, which pip cannot
      # parse. This fails the build if that ever happens again.
      - name: Requirements files must be UTF-8
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          problems = []
          for name in ("requirements.txt", "requirements-dev.txt", "packages.txt"):
              path = Path(name)
              if not path.exists():
                  continue
              raw = path.read_bytes()
              if raw[:2] in (b"\xff\xfe", b"\xfe\xff"):
                  problems.append(f"{name}: UTF-16 byte order mark")
                  continue
              try:
                  raw.decode("utf-8")
              except UnicodeDecodeError as exc:
                  problems.append(f"{name}: not valid UTF-8 ({exc})")

          for problem in problems:
              print(f"::error::{problem}")
          print("checked:", ", ".join(
              n for n in ("requirements.txt", "requirements-dev.txt", "packages.txt")
              if Path(n).exists()
          ))
          sys.exit(1 if problems else 0)
          PY
